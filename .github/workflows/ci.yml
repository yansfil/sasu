name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The pinned Hide build below runs another repository's code
          # inside this workspace; it gets no token from .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm --prefix cli ci

      - name: Build CLI
        run: npm --prefix cli run build

      - name: Run repository tests
        run: node --test tests/*.test.mjs

      - name: Run CLI unit tests
        run: npm --prefix cli test

      # The e2e suite requires an exact private Hide candidate and never
      # discovers an operator executable or skips when the candidate is absent.
      - name: Read the pinned Hide source
        id: hide-pin
        run: |
          repo="$(jq -r .repo cli/test/hide-source.json)"
          ref="$(jq -r .ref cli/test/hide-source.json)"
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "hide-source.json repo is not owner/name: $repo" >&2; exit 1; }
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "hide-source.json ref is not a full commit SHA: $ref" >&2; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Hide source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.hide-pin.outputs.repo }}
          ref: ${{ steps.hide-pin.outputs.ref }}
          path: hide-src
          persist-credentials: false

      - name: Cache the pinned Rust candidate
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hide-src -> target"

      - name: Install the native fixture shell
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Build the pinned Hide candidate
        run: |
          candidate="$(node scripts/build-test-hide.mjs --src hide-src --out "$RUNNER_TEMP/hide-candidate")"
          echo "SASU_TEST_HIDE=$candidate" >> "$GITHUB_ENV"

      - name: Run CLI end-to-end tests
        run: npm --prefix cli run test:e2e

      - name: Check prompt TypeScript
        run: ./cli/node_modules/.bin/tsc -p cli/tsconfig.json --noEmit
