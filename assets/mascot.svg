<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <!-- checkshirt-boy mascot: reference-style webcomic bust (thick white outline
       on black, flat 2-tone linework) wearing a plaid flannel shirt. -->
  <defs>
    <pattern id="plaid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#8b2f2f"/>
      <rect x="0" y="0" width="14" height="40" fill="#6b2121"/>
      <rect x="0" y="0" width="40" height="14" fill="#6b2121"/>
      <rect x="0" y="0" width="14" height="14" fill="#521717"/>
      <line x1="27" y1="0" x2="27" y2="40" stroke="#e8dcc8" stroke-width="2" opacity="0.55"/>
      <line x1="0" y1="27" x2="40" y2="27" stroke="#e8dcc8" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="480" height="560" fill="#000"/>

  <!-- thick white contour: silhouette drawn fat and white underneath the art -->
  <g fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 70 560 Q 78 470 130 440 Q 170 418 205 408 L 205 385 Q 160 340 155 250 Q 152 130 250 118 Q 348 130 345 250 Q 340 340 295 385 L 295 408 Q 330 418 370 440 Q 422 470 430 560 Z"/>
    <path d="M 158 225 Q 130 260 138 330 Q 143 395 122 440 Q 116 452 124 456 Q 140 448 150 400 Q 162 340 158 280 Z"/>
  </g>

  <!-- ponytail (behind the head, viewer-left) -->
  <path d="M 162 220 Q 128 258 136 330 Q 141 396 121 441 Q 117 452 126 454 Q 143 445 152 398 Q 163 338 160 278 Z" fill="#000" stroke="#000" stroke-width="4"/>
  <rect x="127" y="316" width="30" height="13" rx="6" fill="#fff" transform="rotate(4 142 322)"/>

  <!-- shirt: plaid flannel shoulders and torso -->
  <path d="M 78 560 Q 84 478 134 448 Q 172 426 208 416 L 240 428 L 272 416 Q 308 426 346 448 Q 396 478 402 560 Z" fill="url(#plaid)" stroke="#000" stroke-width="5"/>
  <!-- placket and buttons -->
  <line x1="240" y1="430" x2="240" y2="560" stroke="#000" stroke-width="4"/>
  <circle cx="240" cy="470" r="4" fill="#000"/>
  <circle cx="240" cy="510" r="4" fill="#000"/>
  <!-- shoulder seams -->
  <path d="M 134 448 Q 150 470 148 560" fill="none" stroke="#000" stroke-width="3.5"/>
  <path d="M 346 448 Q 330 470 332 560" fill="none" stroke="#000" stroke-width="3.5"/>

  <!-- neck -->
  <path d="M 208 372 L 208 420 Q 240 436 272 420 L 272 372 Z" fill="#fff" stroke="#000" stroke-width="4"/>

  <!-- collar: plaid, folded over the shirt -->
  <path d="M 208 408 L 240 428 L 196 456 Q 180 436 190 414 Z" fill="url(#plaid)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 272 408 L 240 428 L 284 456 Q 300 436 290 414 Z" fill="url(#plaid)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>

  <!-- head: chubby round face -->
  <path d="M 250 122 Q 342 128 340 244 Q 338 316 302 356 Q 276 382 250 382 Q 224 382 198 356 Q 162 316 160 244 Q 158 128 250 122 Z" fill="#fff" stroke="#000" stroke-width="4.5"/>

  <!-- hair: combed back, low hairline, small sideburns -->
  <path d="M 250 120 Q 344 126 341 240 Q 341 246 336 246 Q 330 168 300 158 Q 268 148 250 149 Q 232 148 200 158 Q 170 168 164 246 Q 159 246 159 240 Q 156 126 250 120 Z" fill="#000"/>
  <path d="M 163 246 Q 158 282 166 306 L 175 302 Q 168 278 170 250 Z" fill="#000"/>
  <path d="M 337 246 Q 342 282 334 306 L 325 302 Q 332 278 330 250 Z" fill="#000"/>

  <!-- brow creases -->
  <path d="M 182 210 Q 202 202 224 208" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 276 208 Q 298 202 318 210" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- glasses: small ovals, bridge, temples -->
  <ellipse cx="205" cy="245" rx="35" ry="25" fill="none" stroke="#000" stroke-width="5"/>
  <ellipse cx="295" cy="245" rx="35" ry="25" fill="none" stroke="#000" stroke-width="5"/>
  <line x1="240" y1="241" x2="260" y2="241" stroke="#000" stroke-width="5"/>
  <line x1="170" y1="240" x2="161" y2="236" stroke="#000" stroke-width="4.5"/>
  <line x1="330" y1="240" x2="339" y2="236" stroke="#000" stroke-width="4.5"/>

  <!-- slit eyes -->
  <line x1="188" y1="246" x2="221" y2="246" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <line x1="279" y1="246" x2="312" y2="246" stroke="#000" stroke-width="6" stroke-linecap="round"/>

  <!-- nose hint -->
  <path d="M 247 282 Q 243 290 249 293" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>

  <!-- deadpan mouth -->
  <line x1="228" y1="325" x2="273" y2="325" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- chin crease -->
  <path d="M 226 352 Q 250 362 274 352" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- stubble dots -->
  <g fill="#000">
    <circle cx="215" cy="340" r="2.2"/><circle cx="230" cy="345" r="2.2"/><circle cx="247" cy="341" r="2.2"/>
    <circle cx="263" cy="345" r="2.2"/><circle cx="281" cy="340" r="2.2"/><circle cx="207" cy="352" r="2.2"/>
    <circle cx="222" cy="358" r="2.2"/><circle cx="239" cy="355" r="2.2"/><circle cx="257" cy="358" r="2.2"/>
    <circle cx="273" cy="354" r="2.2"/><circle cx="288" cy="351" r="2.2"/><circle cx="231" cy="368" r="2.2"/>
    <circle cx="248" cy="371" r="2.2"/><circle cx="266" cy="368" r="2.2"/>
  </g>
</svg>
